name: Xu hướng công nghệ Đà Nẵng

on:
  schedule:
    # 12h sáng thứ Hai giờ Việt Nam, lệch giờ với các chủ đề khác
    - cron: "0 5 * * 1"
  workflow_dispatch:

concurrency:
  group: congnghe-trends
  cancel-in-progress: false

jobs:
  xuhuong:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Lấy code
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài thư viện
        run: |
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          else
            pip install pytrends pandas requests firebase-admin
          fi

      - name: Lấy xu hướng công nghệ đà nẵng
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY:  ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          GH_MODELS_TOKEN:   ${{ secrets.GH_MODELS_TOKEN }}
          CEREBRAS_API_KEY:  ${{ secrets.CEREBRAS_API_KEY }}
        run: python backend/xuhuong.py backend/congnghe_keywords.json
